services:
  postgres:
    image: postgres:15.15-bookworm
    container_name: postgresdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: webhook_db
    ports:
      - "5432:5432"
    volumes:
      - webhook-data:/var/lib/postgresql/data

volumes:
  webhook-data:
